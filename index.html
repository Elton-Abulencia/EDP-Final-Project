<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="main.js" type="module" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sidebar">
      <div class="sys-name">Tasa & Tawa</div>
      <div id="sidebarButtons">
        <span class="sidebar-link" data-view="dashboard">Dashboard</span>
        <span class="sidebar-link" data-view="addCustomer">Add Customer</span>
        <span class="sidebar-link" data-view="manageProducts"
          >Manage Products</span
        >
        <span class="sidebar-link" data-view="manageRewards"
          >Manage Rewards</span
        >
        <span class="sidebar-link" data-view="processPurchase"
          >Process Purchase</span
        >
        <span class="sidebar-link" data-view="redeemRewards"
          >Redeem Rewards</span
        >
        <span class="sidebar-link" data-view="customerProfile"
          >Customer Profile</span
        >
        <span class="sidebar-link" data-view="findCustomer">Find Customer</span>
      </div>
    </div>
    <hr />
    <div id="root"></div>

    <template id="dashboard">
      <h3>Dashboard</h3>
      <hr />
      <button id="showAddCustomerButton">Add Customer</button>
      <button id="showPurchaseProcessButton">Process Purchase</button>
      <button id="showRedeemButton">Redeem Rewards</button>
      <button id="findCustomer">Find Customer</button>
    </template>

    <template id="addCustomer">
      <h3>Add New Customer</h3>
      <hr />
      <form action="" id="addCustomerForm">
        <label for="name">Name</label>
        <input type="text" name="name" id="name" placeholder="name" />
        <p id="nameErr" style="color: red"></p>

        <label for="contact">Contact (Optional)</label>
        <input
          type="text"
          name="contact"
          id="contact"
          placeholder="09..., @handle, or email"
        />
        <p id="contactErr" style="color: red"></p>

        <label for="note">Note / Description (Optional)</label>
        <textarea name="note" id="note" placeholder="customer notes"></textarea>

        <label for="code">Code</label>
        <input type="text" name="code" id="code" placeholder="code" />
        <p id="codeErr" style="color: red"></p>
        <button type="button" id="generateCode">Generate Code</button>
        <br /><br />
        <button type="submit" id="submitBtn">Submit</button>
        <p id="successMsg" style="color: green"></p>
      </form>
    </template>

    <template id="manageProducts">
      <h3>Manage Products</h3>
      <hr />

      <h4 id="formHeading">Add New Product</h4>
      <form id="productForm">
        <label for="productName">Product Name</label>
        <input type="text" name="productName" id="productName" />
        <p id="nameErr" style="color: red"></p>

        <label for="description">Description</label>
        <textarea name="description" id="description"></textarea>
        <p id="descErr" style="color: red"></p>

        <label for="points">Points</label>
        <input type="number" name="points" id="points" />
        <p id="pointsErr" style="color: red"></p>

        <div>
          <button type="submit" id="submitBtn">Add Product</button>
          <button type="button" id="cancelEditBtn" style="display: none">
            Cancel Edit
          </button>
        </div>
        <p id="successMsg" style="color: green"></p>
      </form>

      <hr />
      <h4>Product List</h4>
      <template id="manageProductEntry">
        <li class="manage-product-item">
          <div>
            <div>
              <strong class="itemName"></strong> | Points:
              <span class="itemPoints"></span>
            </div>
            <small class="itemDesc"></small>
          </div>
          <div>
            <button type="button" class="editBtn">Edit</button>
            <button type="button" class="deleteBtn">Delete</button>
          </div>
        </li>
      </template>
      <ul id="productList"></ul>

      <div
        id="paginationControls"
        style="display: flex; gap: 10px; align-items: center"
      >
        <button type="button" id="prevPageBtn">Previous</button>
        <span id="pageIndicator"></span>
        <button type="button" id="nextPageBtn">Next</button>
      </div>
    </template>

    <template id="manageRewards">
      <h3>Manage Rewards</h3>
      <hr />

      <h4 id="formHeading">Add New Reward</h4>
      <form id="rewardForm">
        <label for="rewardName">Reward Name</label>
        <input type="text" name="rewardName" id="rewardName" />
        <p id="nameErr" style="color: red"></p>

        <label for="description">Description</label>
        <textarea name="description" id="description"></textarea>
        <p id="descErr" style="color: red"></p>

        <label for="points">Points Cost</label>
        <input type="number" name="points" id="points" />
        <p id="pointsErr" style="color: red"></p>

        <div>
          <button type="submit" id="submitBtn">Add Reward</button>
          <button type="button" id="cancelEditBtn" style="display: none">
            Cancel Edit
          </button>
        </div>
        <p id="successMsg" style="color: green"></p>
      </form>

      <hr />
      <h4>Reward List</h4>
      <template id="manageRewardEntry">
        <li class="manage-reward-item">
          <div>
            <div>
              <strong class="itemName"></strong> | Points Cost:
              <span class="itemPoints"></span>
            </div>
            <small class="itemDesc"></small>
          </div>
          <div>
            <button type="button" class="editBtn">Edit</button>
            <button type="button" class="deleteBtn">Delete</button>
          </div>
        </li>
      </template>
      <ul id="rewardList"></ul>

      <div
        id="paginationControls"
        style="display: flex; gap: 10px; align-items: center"
      >
        <button type="button" id="prevPageBtn">Previous</button>
        <span id="pageIndicator"></span>
        <button type="button" id="nextPageBtn">Next</button>
      </div>
    </template>

    <template id="processPurchase">
      <h3>Process Purchase</h3>
      <hr />
      <label for="code">Code</label>
      <input type="text" name="code" id="code" />
      <button type="button" id="findCustomer">Find Customer</button>
      <p id="findError"></p>

      <div id="displayCustomer" style="display: none">
        <div><strong>Name:</strong> <span id="customerName"></span></div>
        <div><strong>Points:</strong> <span id="customerPoints"></span></div>
      </div>

      <div id="purchaseWorkflow" style="display: none">
        <hr />
        <h3>Added Products (Cart)</h3>
        <template id="addedProductEntry">
          <li class="added-product-item">
            <span
              >name: <span class="productName"></span> | points:
              <span class="points"></span> | qty: <span class="quantity"></span
            ></span>
            <div>
              <button type="button" class="increaseProduct">+</button>
              <button type="button" class="decreaseProduct">-</button>
              <button type="button" class="removeProduct">Remove</button>
            </div>
          </li>
        </template>
        <ul id="addedProducts"></ul>
        <hr />

        <h3>Product Catalog</h3>
        <template id="productEntry">
          <li class="product-item">
            <span
              >name: <span class="productName"></span> | points:
              <span class="points"></span
            ></span>
            <button type="button" class="addProduct">Add Product</button>
          </li>
        </template>
        <ul id="productList"></ul>
        <div
          id="productPaginationControls"
          style="display: flex; gap: 10px; align-items: center"
        >
          <button type="button" id="prevProductPageBtn">Previous</button>
          <span id="productPageIndicator"></span>
          <button type="button" id="nextProductPageBtn">Next</button>
        </div>
        <hr />
        <button id="confirmTransaction">Confirm Transaction</button>
      </div>
    </template>

    <template id="redeemRewards">
      <h3>Redeem Rewards</h3>
      <hr />
      <div>
        <label for="code">Code</label>
        <input type="text" name="code" id="code" />
        <button type="button" id="findCustomer">Find Customer</button>
        <p id="findError" style="color: red"></p>
      </div>

      <div
        id="displayCustomer"
        style="
          display: none;
          border: 1px solid #000;
          padding: 10px;
          margin-top: 10px;
          max-width: 300px;
        "
      >
        <div><strong>Name:</strong> <span id="customerName"></span></div>
        <div><strong>Points:</strong> <span id="customerPoints"></span></div>
      </div>

      <div id="redeemWorkflow" style="display: none">
        <hr />
        <h3>Selected Rewards (Cart)</h3>
        <template id="addedRewardEntry">
          <li class="added-reward-item">
            <span
              >name: <span class="rewardName"></span> | points cost:
              <span class="points"></span> | qty: <span class="quantity"></span
            ></span>
            <div>
              <button type="button" class="increaseReward">+</button>
              <button type="button" class="decreaseReward">-</button>
              <button type="button" class="removeReward">Remove</button>
            </div>
          </li>
        </template>
        <ul id="addedRewards"></ul>
        <hr />

        <h3>Available Rewards</h3>
        <template id="rewardEntry">
          <li class="reward-item">
            <span
              >name: <span class="rewardName"></span> | points:
              <span class="points"></span
            ></span>
            <button type="button" class="addReward">Redeem</button>
          </li>
        </template>
        <ul id="rewardList"></ul>
        <div
          id="rewardPaginationControls"
          style="display: flex; gap: 10px; align-items: center"
        >
          <button type="button" id="prevRewardPageBtn">Previous</button>
          <span id="rewardPageIndicator"></span>
          <button type="button" id="nextRewardPageBtn">Next</button>
        </div>
        <hr />
        <button id="confirmRedemption">Confirm Redemption</button>
      </div>
    </template>

    <template id="customerProfile">
      <h3>Customer Profile</h3>
      <hr />
      <div>
        <label for="code">Code</label>
        <input type="text" name="code" id="code" placeholder="6-digit code" />
        <button type="button" id="findCustomer">Find Customer</button>
        <p id="findError" style="color: red"></p>
      </div>

      <div id="profileContent" style="display: none">
        <hr />
        <div><strong>Name:</strong> <span id="profileName"></span></div>
        <div><strong>Code:</strong> <span id="profileCode"></span></div>
        <div><strong>Points:</strong> <span id="profilePoints"></span></div>

        <div style="margin-top: 12px; display: flex; gap: 10px">
          <button type="button" id="profilePurchaseBtn">
            Process Purchase
          </button>
          <button type="button" id="profileRedeemBtn">Redeem Rewards</button>
        </div>

        <hr />
        <form id="profileDetailsForm">
          <label for="profileContact">Contact</label>
          <input
            type="text"
            id="profileContact"
            placeholder="09..., @handle, or email"
          />
          <p id="contactErr" style="color: red"></p>

          <label for="profileNote">Note / Description</label>
          <textarea
            id="profileNote"
            rows="3"
            placeholder="Customer preferences or notes..."
          ></textarea>

          <button type="submit">Save Details</button>
          <p id="saveMsg" style="color: green"></p>
        </form>

        <hr />
        <h4>History Logs</h4>
        <template id="historyEntry">
          <li class="history-item">
            <div>
              <strong class="historyTitle"></strong> -
              <span class="historyDesc"></span>
            </div>
            <small class="historyDate"></small>
          </li>
        </template>
        <ul id="historyList"></ul>

        <div
          id="historyPaginationControls"
          style="display: flex; gap: 10px; align-items: center"
        >
          <button type="button" id="prevHistoryPageBtn">Previous</button>
          <span id="historyPageIndicator"></span>
          <button type="button" id="nextHistoryPageBtn">Next</button>
        </div>
      </div>
    </template>
    <template id="findCustomer">
      <h3>Find Customer</h3>
      <hr />
      <div>
        <label for="searchQuery">Code, Name, or Contact</label>
        <input
          type="text"
          id="searchQuery"
          placeholder="Search by 6-digit code, name, 09..., @handle, or email"
        />
        <button type="button" id="searchBtn">Search</button>
      </div>

      <hr />
      <p id="resultCount"></p>

      <template id="customerResultEntry">
        <li class="customer-result-item">
          <div>
            <div>
              <strong class="resultName"></strong> (<span
                class="resultCode"
              ></span
              >)
            </div>
            <div>
              Contact: <span class="resultContact"></span> | Points:
              <span class="resultPoints"></span>
            </div>
          </div>
          <button type="button" class="viewProfileBtn">View Profile</button>
        </li>
      </template>

      <ul id="searchResults"></ul>
    </template>
  </body>
</html>
